name: jewelmatch
description: Jewel Match by Wajiha - a vintage jeweler's atelier match-3.
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  cupertino_icons: ^1.0.8
  in_app_purchase: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/jewelmatch_logo.png
    - assets/wajiha_logo.png

  fonts:
    - family: NotoSerifDisplay
      fonts:
        - asset: assets/fonts/NotoSerifDisplay-Regular.ttf
        - asset: assets/fonts/NotoSerifDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSerifDisplay-Italic.ttf
          style: italic
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
